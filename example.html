<!DOCTYPE html>
<html>
    <head>
        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        
        <!-- optional styling, just for the example to centre the image -->
        <style>
            html, body { height: 100%; margin: 0; font-family: "Google Sans";}
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .interactive-map {
                width: 80vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .interactive-map img {
                max-width: 80vw;
                max-height: 100vh;
                width: auto;
                height: auto;
                display: block;
            }
        </style>
    </head>
    <body>
        <!-- Mock what squarespace might do when adding an image block -->
        <div class="interactive-map">
            <img src="assets/map.jpeg" alt="Interactive map image">
        </div>

        <!-- load the script -->
        <script src="interactiveMap.js"></script>
    </body>
</html>
